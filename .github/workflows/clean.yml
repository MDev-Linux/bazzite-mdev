name: Cleanup
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  cleanup-containers:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 30 Days
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: bazzite-mdev-gnome,bazzite-mdev-gnome-nvidia-open
          older-than: 30 days
          delete-orphaned-images: true
          keep-n-tagged: 0
          keep-n-untagged: 0

      - name: Delete Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: bazzite-mdev-gnome,bazzite-mdev-gnome-nvidia-open
          delete-orphaned-images: true
          delete-untagged: true

  cleanup-workflows:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete Workflows Older Than 30 Days
        uses: igorjs/gh-actions-clean-workflow@b910eb365da5e592d865ddd8a72d01cbd720b3b1 # v8.0.0
        with:
          token: ${{ github.token }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.repository }}
          runs_older_than: 30
          runs_to_keep: 0
